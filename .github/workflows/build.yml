name: Build Van Link

# Builds the Windows installer and the macOS/Linux versions.
# Push a tag like v0.1.0 to publish them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y nsis binutils-mingw-w64-x86-64 ffmpeg
      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: van-link
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VanLink-Setup-*.exe
            dist/vanlink-macos-*
            dist/vanlink-linux-x64
