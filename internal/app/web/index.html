<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Van Link</title>
<style>
:root{--bg:#16181D;--panel:#1F2229;--panel2:#262A33;--line:#2E323B;--text:#E8EAED;--muted:#A3A9B0;--blue:#2E7D32;--blueText:#A7E08A;
--good:#22C55E;--goodBg:#12351F;--goodText:#86EFAC;--warnBg:#3A2A12;--warnText:#FCD34D;--badBg:#3B1515;--badText:#FCA5A5;--live:#DC2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 14px;min-height:40px}
button:hover{border-color:#4B5160}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
button.live{background:var(--live);border-color:var(--live);color:#fff;font-weight:700;font-size:17px;padding:14px}
button.danger{color:var(--badText)}
button:disabled{opacity:.5;cursor:default}
a>button{color:var(--text)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{resize:vertical;min-height:72px;font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.brand{font-weight:700;font-size:16px}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--goodText);border-color:#1F5F35}
.pill.bad{color:var(--badText);border-color:#6B2323}
.grow{flex:1}
main{max-width:1100px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{margin:0 0 4px;font-size:17px}
.sub{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.banner{border-radius:10px;padding:12px 14px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px}
.banner.idle{background:var(--panel2);color:var(--muted)}
.banner.good{background:var(--goodBg);color:var(--goodText)}
.banner.warn{background:var(--warnBg);color:var(--warnText)}
.banner.bad{background:var(--badBg);color:var(--badText)}
.banner.onair{background:var(--live);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.side{background:var(--panel2);border-radius:10px;padding:12px 14px}
.side h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.bars{display:inline-flex;gap:3px;align-items:flex-end;height:16px;margin-right:8px;vertical-align:-2px}
.bars i{display:block;width:5px;border-radius:1px;background:#3A3F4A}
.bars i.on{background:var(--good)}
.role{display:flex;gap:16px;align-items:flex-start;text-align:left;padding:18px;border-radius:12px;width:100%;background:var(--panel);border:2px solid var(--line)}
.role:hover{border-color:var(--blue)}
.role b{font-size:17px;display:block;margin-bottom:4px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:12px}
.step::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.step>div{flex:1;min-width:0}
.msg{font-size:13px;margin-top:6px}
.msg.err{color:var(--badText)}
.msg.ok{color:var(--goodText)}
.hint{background:var(--warnBg);color:var(--warnText);border-radius:10px;padding:10px 14px;font-size:13px}
.hint b{color:#FDE68A}
details summary{cursor:pointer;color:var(--blueText);font-size:13px;margin-top:6px}
.events{font-size:12px;color:var(--muted);margin:6px 0 0;padding:0;list-style:none}
.events li{padding:2px 0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#1F4D22;color:#C5EBB0;margin-left:6px;font-weight:600}
.big{font-size:22px;font-weight:700;margin:0 0 4px}
.hide{display:none!important}
.auth{max-width:440px;margin:30px auto 0;width:100%}
.auth h2{font-size:22px;margin-bottom:6px}
.link{background:none;border:0;padding:0;min-height:0;color:var(--blueText);text-decoration:underline;font-size:13px}
.pill.plan{color:var(--blueText);border-color:#2F5A2F}
body.dock header .pill.ver, body.dock .nodock{display:none}
body.dock main{padding:10px;gap:10px}
body.dock .card{padding:12px}
</style>
</head>
<body>
<header>
<div><div class="brand">Van Link</div></div>
<span class="pill" id="rolePill"></span>
<div class="grow"></div>
<span class="pill plan" id="planPill"></span>
<span class="pill" id="obsPill" title="">OBS</span>
<button id="gear" aria-label="Settings">Settings</button>
</header>
<main id="main"></main>

<template id="tSettings">
<div class="card" id="settings">
<div class="row"><h2 class="grow">Settings</h2><button data-act="closeSettings">Close</button></div>
<div class="grid2">
<div>
<label for="sName">Name shown to the other side</label><input id="sName" maxlength="40">
<label><input id="sObsAuto" type="checkbox" style="width:auto"> Connect to OBS automatically (recommended)</label>
<p class="sub">Van Link switches on OBS's remote control by itself and connects. Nothing to set up.</p>
<div id="manualObs">
<label for="sObsAddr">OBS address (manual)</label><input id="sObsAddr" placeholder="127.0.0.1:4455">
<label for="sObsPass">OBS WebSocket password (manual)</label><input id="sObsPass" type="password" placeholder="Leave blank to keep the saved one">
</div>
</div>
<div>
<label for="sLat">Delay buffer (studio decides; the van follows)</label>
<select id="sLat"><option value="300">Short – 0.3 s (strong, stable internet)</option><option value="1000">Normal – 1 s (recommended)</option><option value="2000">Safe – 2 s (mobile data, weak signal)</option><option value="4000">Extra safe – 4 s</option></select>
<label><input id="sStun" type="checkbox" style="width:auto"> Allow the public address check</label>
<p class="sub">A few bytes asking "what is my internet address?". Needed for direct dialling over IPv4. Video never goes through it.</p>
<div class="row" style="margin-top:12px"><button class="primary" data-act="saveSettings">Save</button><span class="msg" id="sMsg"></span></div>
</div>
</div>
<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
<h2>Account and licence</h2>
<div id="acct"></div>
<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
<div class="grid2">
<div>
<h2>Network test</h2>
<p class="sub">Checks how this internet connection will work for Van Link.</p>
<div class="row" style="margin-top:10px"><button data-act="netTest" id="ntBtn">Run network test</button></div>
<div id="ntOut"></div>
</div>
<div>
<h2>One-click setup</h2>
<p class="sub" id="setupText"></p>
<div class="row" style="margin-top:10px"><button data-act="setup" id="setupBtn">Allow and set up</button><button data-act="restore" id="restoreBtn">Restore original settings</button></div>
<div class="msg" id="setupMsg"></div>
</div>
</div>
<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
<h2>Van Link panel in OBS</h2>
<p class="sub" id="panelText"></p>
<div class="row" style="margin-top:10px"><button data-act="obsPanel" id="panelBtn">Add the panel to OBS</button></div>
<div class="msg" id="panelMsg"></div>
<p class="sub" style="margin-top:10px">Closing this window keeps Van Link running, so the OBS panel and any broadcast carry on. To stop Van Link completely, use Quit below.</p>
<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
<div class="row"><button class="danger" data-act="changeRole">Change this computer's role</button><button data-act="quit">Quit Van Link</button><span class="sub grow" style="text-align:right">Van Link <span id="ver"></span></span></div>
</div>
</template>

<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dock = new URLSearchParams(location.search).has("dock");
if (dock) document.body.classList.add("dock");

let S = null, viewKey = "", showSettings = false, lastEmail = "";
const liveSince = {};          // when "live" started, per feed, for the on-air clock
const notes = {};              // messages under buttons, per key

async function api(path, body) {
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json","X-VanLink":"1"}, body: JSON.stringify(body||{})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong");
  return j;
}
async function refresh() {
  try { S = await (await fetch("/api/state")).json(); render(); }
  catch (e) { $("#obsPill").textContent = "Van Link stopped"; }
}

function bars(n) { let h=""; for (let i=0;i<4;i++) h += `<i class="${i<n?"on":""}" style="height:${6+i*4}px"></i>`; return `<span class="bars" aria-hidden="true">${h}</span>`; }
function clock(sec) { sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return [h,m,s].map(x=>String(x).padStart(2,"0")).join(":"); }
function since(key, on) { if (on) { liveSince[key] ??= Date.now(); return clock((Date.now()-liveSince[key])/1000); } delete liveSince[key]; return ""; }
function mbps(k) { return k >= 1000 ? (k/1000).toFixed(1)+" Mbps" : Math.round(k)+" kbps"; }
function delay(ms, s) { if (ms) return (ms/1000).toFixed(ms<1000?2:1)+" s"; return s && s.connected && s.linkSecs > 5 ? "under 0.01 s" : "measuring…"; }
function note(key) { const n = notes[key]; return n ? `<div class="msg ${n.err?"err":"ok"}">${esc(n.text)}</div>` : ""; }
function share(text, code) { return `https://wa.me/?text=${encodeURIComponent(text + "\n\n" + code)}`; }

// ------------------------------------------------------------ render
function render() {
  $("#rolePill").textContent = S.role === "studio" ? "Studio" : S.role === "van" ? "Van" : "Setup";
  $("#rolePill").classList.toggle("hide", !S.licence.ok);
  const op = $("#obsPill");
  op.className = "pill " + (S.obs.connected ? "ok" : "bad");
  op.textContent = S.obs.connected ? "OBS connected" : "OBS not connected";
  op.title = S.obs.error || "";

  const L = S.licence, pp = $("#planPill");
  pp.classList.toggle("hide", !S.account);
  if (S.account) {
    pp.className = "pill " + (L.ok ? "plan" : "bad");
    pp.textContent = !L.ok ? "Locked" : L.trialLeft != null ? `Trial · ${Math.floor(L.trialLeft/60)} min left today` : L.planName;
  }
  const key = [L.ok, L.reason, S.account, showSettings, (S.vans||[]).map(v=>v.id+v.hasReply).join(","), S.van ? "paired" : "none"].join("|");
  if (key !== viewKey) { viewKey = key; buildView(); }
  updateView();
}

function obsHint() {
  if (S.obs.connected) return "";
  if (!S.obs.manual) return `<div class="hint"><b>Waiting for OBS.</b> ${esc(S.obs.error || "Open OBS - Van Link connects to it automatically.")}</div>`;
  return `<div class="hint"><b>OBS not connected.</b> Check the OBS address and password in <b>Settings</b>. ${S.obs.error ? "<br><span style='opacity:.8'>"+esc(S.obs.error)+"</span>" : ""}</div>`;
}

function buildView() {
  const m = $("#main");
  let h = `<div id="obsHint"></div>`;
  if (showSettings) h += $("#tSettings").innerHTML;
  if (!S.licence.ok) h += licenceView();
  else if (!S.role) h += roleView();
  else if (S.role === "studio") h += studioView();
  else h += vanView();
  m.innerHTML = h;
  if (showSettings) fillSettings();
}

function roleView() {
  return `<div class="card"><h2 class="big">How is this computer being used?</h2><p class="sub">You can change this later in Settings.</p>
  <div class="grid2" style="margin-top:16px">
  <button class="role" data-act="role" data-role="studio"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#A7E08A" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
  <span><b>This is the Studio</b><span class="sub">Receives the live picture from the van as an OBS source.</span></span></button>
  <button class="role" data-act="role" data-role="van"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FCD9A6" stroke-width="1.8" aria-hidden="true"><path d="M2 7h11v9H2zM13 10h4l3 3v3h-7z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>
  <span><b>This is the Van</b><span class="sub">Sends the live programme from OBS to the studio.</span></span></button>
  </div></div>`;
}

// ------------------------------------------------------------ sign-in and licence
function fmtDate(t) { return new Date(t*1000).toLocaleDateString(undefined, {day:"numeric", month:"long", year:"numeric"}); }
function signinForm(email) {
  return `<label for="inEmail">Email</label><input id="inEmail" type="email" autocomplete="username" value="${esc(email||lastEmail)}">
  <label for="inPass">Password</label><input id="inPass" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:14px"><button class="primary" data-act="signin" style="flex:1">Sign in</button></div>${note("signin")}`;
}
function codeForm() {
  return `<label for="regCode">Registration code</label>
  <div class="row"><input id="regCode" placeholder="VLK-XXXX-XXXX-XXXX" style="flex:1;text-transform:uppercase;font-family:ui-monospace,Consolas,monospace">
  <button class="primary" data-act="redeem">Activate</button></div>${note("redeem")}
  <p class="sub" style="margin-top:6px">You get a registration code by email (and on your account page) as soon as you pay.</p>`;
}
function licenceView() {
  const L = S.licence;
  if (L.reason === "signin" || !S.account) return `<div class="card auth">
    <h2>Sign in to Van Link</h2><p class="sub">Use the email and password of your Van Link account.</p>
    ${signinForm()}
    <p class="sub" style="margin-top:16px">New here? <button class="link" data-act="web" data-page="signup.php">Create a free trial account</button> · 14 days, 30 minutes of broadcasting a day.</p>
    <p class="sub" style="margin-top:6px"><button class="link" data-act="web" data-page="#pricing">See plans and prices</button></p></div>`;
  const again = L.reason === "invalid" || L.reason === "device";
  let h = `<div class="card auth"><div class="banner bad"><span class="dot"></span>Van Link is locked</div>
    <p style="margin:12px 0 4px">${esc(L.message)}</p>
    <p class="sub">Signed in as ${esc(S.account)}${L.planName ? " · " + esc(L.planName) + (L.expires ? " until " + fmtDate(L.expires) : "") : ""}</p>`;
  if (again) h += signinForm(S.account);
  else if (L.reason === "expired") h += codeForm() + `<div class="row" style="margin-top:14px">
      <button data-act="web" data-page="buy.php?plan=standard">Buy Standard · $1,100/yr</button>
      <button data-act="web" data-page="buy.php?plan=pro">Buy Pro · $1,900/yr</button></div>
      <p class="sub" style="margin-top:6px">Opens the Van Link website in your browser. We accept all cards.</p>`;
  else if (L.reason === "clock") h += `<p class="sub" style="margin-top:10px">Set the correct date and time in Windows (Settings › Time &amp; language), then click Check again.</p>`;
  h += `<div class="row" style="margin-top:16px"><button data-act="refreshLic">Check again</button><button data-act="web" data-page="account.php">My account</button>
    <span class="grow"></span><button class="link" data-act="signout">Sign out</button></div>${note("refreshLic")}</div>`;
  return h;
}
function trialHint() {
  const L = S.licence;
  if (!L.ok || L.trialLeft == null) return "";
  if (L.trialLeft <= 0) return `<div class="hint"><b>Today's 30 free minutes are used up.</b> Broadcasting is available again tomorrow. <button class="link" data-act="web" data-page="buy.php?plan=standard">Buy a plan</button> to remove the limit.</div>`;
  if (L.expires && L.expires - Date.now()/1000 < 3*86400) return `<div class="hint"><b>Your free trial ends on ${fmtDate(L.expires)}.</b> <button class="link" data-act="web" data-page="buy.php?plan=standard">Buy a plan</button> to keep broadcasting.</div>`;
  return "";
}
function accountSettings() {
  const L = S.licence;
  if (!S.account) return `<p class="sub">Not signed in.</p>`;
  return `<div class="grid2"><div class="side">
    <div class="kv"><span>Email</span><span>${esc(S.account)}</span></div>
    <div class="kv"><span>Plan</span><span>${esc(L.planName || "—")}</span></div>
    <div class="kv"><span>${L.ok ? "Valid until" : "Status"}</span><span>${L.ok ? (L.plan === "owner" ? "Unlimited" : L.expires ? fmtDate(L.expires) : "—") : "Locked"}</span></div>
    <div class="kv"><span>Vans allowed</span><span>${L.maxVans || "—"}</span></div></div>
    <div>${codeForm()}</div></div>
    <div class="row" style="margin-top:12px"><button data-act="web" data-page="account.php">My account on the website</button>
    ${L.plan === "owner" ? "" : `<button data-act="web" data-page="buy.php?plan=standard">Buy or renew</button>`}
    <button data-act="refreshLic">Check licence now</button><span class="grow"></span><button class="danger" data-act="signout">Sign out of this computer</button></div>${note("refreshLic")}`;
}

// ------------------------------------------------------------ studio
function studioView() {
  let h = `<div class="card nodock"><div class="row"><div class="grow"><h2>Vans</h2><p class="sub">Each van appears in OBS as its own source, in the scene "Van Link".</p></div>
  <input id="newVanName" placeholder="Name, e.g. Stadium van" style="max-width:220px"><button class="primary" data-act="addVan">Add a van</button></div>${note("add")}</div>`;
  if (!S.vans || !S.vans.length) h += `<div class="card"><p class="sub">No vans yet. Click <b>Add a van</b> to create a pairing code to send to the van.</p></div>`;
  for (const v of S.vans || []) {
    h += `<div class="card" id="v_${v.id}">
    <div class="row"><h2 class="grow">${esc(v.name)}</h2><span class="sub" id="v_${v.id}_src"></span>
      <button data-act="jump" data-id="${v.id}" title="Restarts the OBS source to drop any delay that has built up">Jump to live</button></div>
    <div id="v_${v.id}_mon" style="margin-top:10px"></div>
    <details id="v_${v.id}_pair" ${v.hasReply ? "" : "open"}><summary>Pairing</summary>
      <div class="steps" style="margin-top:12px">
      <div class="step"><div><b>Send this code to the van</b> (WhatsApp, SMS or email)
        <textarea readonly id="v_${v.id}_code">${esc(v.code)}</textarea>
        <div class="row" style="margin-top:6px"><button data-act="copy" data-src="v_${v.id}_code">Copy code</button>
        <a href="${share("Van Link code from the studio for "+v.name+". Paste it in Van Link on the van computer:", v.code)}" target="_blank" rel="noopener"><button>Share on WhatsApp</button></a></div></div></div>
      <div class="step"><div><b>Paste the reply code the van sends back</b>
        <textarea id="v_${v.id}_reply" placeholder="VL1…"></textarea>
        <div class="row" style="margin-top:6px"><button class="primary" data-act="reply" data-id="${v.id}">Connect</button></div>${note("reply"+v.id)}
        <p class="sub" style="margin-top:6px">If this studio is directly reachable, the van connects even before you paste its reply.</p></div></div>
      </div></details>
    <details class="nodock"><summary>Advanced</summary><div id="v_${v.id}_adv" class="mono" style="margin-top:8px"></div>
      <button class="danger" style="margin-top:10px" data-act="removeVan" data-id="${v.id}">Remove this van</button></details>
    </div>`;
  }
  return h;
}

function studioMon(v) {
  const s = v.snap, p = s.peer || {};
  let b;
  if (!s.connected) b = v.hasReply ? ["warn","Connecting to the van…"] : ["idle","Waiting for the van to pair"];
  else if (s.liveHere) b = ["good", "Receiving van live · " + since(v.id, true)];
  else if (p.live) b = ["warn","The van is sending – waiting for the picture…"];
  else b = ["idle","Van connected · not sending yet"];
  if (!(s.connected && s.liveHere)) since(v.id, false);
  return `<div class="banner ${b[0]}"><span class="dot"></span>${esc(b[1])}</div>
  <div class="grid2" style="margin-top:10px">
   <div class="side"><h3>${esc(p.n || v.name)} (sending)</h3>
    <div class="kv"><span>Signal</span><span>${bars(s.connected ? p.sig : 0)}${esc(s.connected ? s.peerSignalWord : "—")}</span></div>
    <div class="kv"><span>Upload</span><span>${s.connected && p.kbps ? mbps(p.kbps) : "—"}</span></div>
    <div class="kv"><span>OBS in the van</span><span>${s.connected ? (p.obs ? "Sending to Van Link" : "Not streaming") : "—"}</span></div>
   </div>
   <div class="side"><h3>Studio (receiving)</h3>
    <div class="kv"><span>Signal</span><span>${bars(s.signal)}${esc(s.signalWord)}</span></div>
    <div class="kv"><span>Network delay</span><span>${s.connected ? delay(s.delayMs, s) : "—"}</span></div>
    <div class="kv"><span>Missing data</span><span>${s.liveHere ? s.repairPct.toFixed(1)+"% (repaired)" : "—"}</span></div>
    <div class="kv"><span>Route</span><span>${esc(s.route || "—")}${s.encrypted ? '<span class="tag">Encrypted</span>' : ""}</span></div>
   </div>
  </div>${events(s)}`;
}

// ------------------------------------------------------------ van
function vanView() {
  if (!S.van) return `<div class="card"><h2 class="big">Pair with your studio</h2><p class="sub">Paste the code the studio sent you.</p>
    <textarea id="studioCode" placeholder="VL1…" style="margin-top:12px"></textarea>
    <div class="row" style="margin-top:8px"><button class="primary" data-act="pair">Pair</button></div>${note("pair")}</div>`;
  return `<div class="card">
   <div id="vanMon"></div>
   <div class="row" style="margin-top:12px"><button class="live" id="liveBtn" data-act="golive" style="flex:1">GO LIVE</button></div>${note("live")}
   <details id="vanPair"><summary>Reply code for the studio</summary>
     <p class="sub" style="margin-top:8px">Send this back to the studio so it can dial you.</p>
     <textarea readonly id="replyCode">${esc(S.van.reply)}</textarea>
     <div class="row" style="margin-top:6px"><button data-act="copy" data-src="replyCode">Copy code</button>
     <a href="${share("Van Link reply code from the van. Paste it in Van Link at the studio:", S.van.reply)}" target="_blank" rel="noopener"><button>Share on WhatsApp</button></a></div>
   </details>
   <details class="nodock"><summary>Advanced</summary><div id="vanAdv" class="mono" style="margin-top:8px"></div>
     <button class="danger" style="margin-top:10px" data-act="unpair">Forget this studio</button></details>
  </div>`;
}

function vanMon() {
  const s = S.van.snap, p = s.peer || {}, streaming = S.van.streaming;
  let b;
  if (!s.connected) b = ["warn","Connecting to the studio…"];
  else if (streaming && s.peerLive) b = ["onair","LIVE AT STUDIO · " + since("van", true)];
  else if (streaming) b = ["warn","Sending – waiting for the studio to confirm…"];
  else b = ["good","Connected to " + (p.n || "the studio") + " · ready to go live"];
  if (!(s.connected && streaming && s.peerLive)) since("van", false);
  let tip = "";
  if (streaming && s.connected && s.signal && s.signal <= 2) tip = `<div class="hint" style="margin-top:10px"><b>Signal is weak.</b> Keep the Program as your only feed, lower the bitrate in OBS (Settings › Output), or move to better coverage. Van Link is repairing lost data to keep you on air.</div>`;
  return `<div class="banner ${b[0]}"><span class="dot"></span>${esc(b[1])}</div>${tip}
  <div class="grid2" style="margin-top:10px">
   <div class="side"><h3>Your upload (van)</h3>
    <div class="kv"><span>Signal</span><span>${bars(s.signal)}${esc(s.signalWord)}</span></div>
    <div class="kv"><span>Sending</span><span>${streaming && s.kbps ? mbps(s.kbps) : "—"}</span></div>
    <div class="kv"><span>Feed</span><span>Program (primary)</span></div>
   </div>
   <div class="side"><h3>Studio reception</h3>
    <div class="kv"><span>Signal</span><span>${bars(s.connected ? p.sig : 0)}${esc(s.connected ? s.peerSignalWord : "—")}</span></div>
    <div class="kv"><span>Network delay</span><span>${s.connected ? delay(s.delayMs, s) : "—"}</span></div>
    <div class="kv"><span>Missing data</span><span>${s.connected && p.live ? p.rep.toFixed(1)+"% (repaired)" : "—"}</span></div>
    <div class="kv"><span>Route</span><span>${esc(s.route || "—")}${s.encrypted ? '<span class="tag">Encrypted</span>' : ""}</span></div>
   </div>
  </div>${events(s)}`;
}

function events(s) {
  const ev = (s.events || []).slice(-4).reverse();
  if (!ev.length) return "";
  return `<ul class="events nodock">${ev.map(e => `<li>${new Date(e.at).toLocaleTimeString()} – ${esc(e.text)}</li>`).join("")}</ul>`;
}

function advanced(s) {
  return `Our addresses: ${esc((s.candidates||[]).join(", ") || "—")}<br>
  Suggested delay buffer: ${s.recLatencyMs} ms · Link capacity: ${s.linkKbps ? mbps(s.linkKbps) : "—"} · Data so far: ${s.totalMb.toFixed(1)} MB · Drops: ${s.drops}`;
}

// ------------------------------------------------------------ update in place
function updateView() {
  $("#obsHint").innerHTML = S.licence.ok ? trialHint() + obsHint() : "";
  if (S.role === "studio") for (const v of S.vans || []) {
    const mon = $("#v_" + v.id + "_mon"); if (!mon) continue;
    mon.innerHTML = studioMon(v);
    $("#v_" + v.id + "_src").textContent = v.obsReady ? "OBS source: " + v.obsSource : (S.obs.connected ? "Creating OBS source…" : "");
    $("#v_" + v.id + "_adv").innerHTML = advanced(v.snap);
    const pair = $("#v_" + v.id + "_pair");
    if (v.snap.connected && pair.open && !pair.dataset.touched) pair.open = false;
  }
  if (S.role === "van" && S.van) {
    $("#vanMon").innerHTML = vanMon();
    $("#vanAdv").innerHTML = advanced(S.van.snap);
    const btn = $("#liveBtn");
    if (S.van.streaming) { btn.textContent = "STOP"; btn.dataset.act = "stop"; btn.className = ""; }
    else { btn.textContent = "GO LIVE"; btn.dataset.act = "golive"; btn.className = "live"; }
    btn.disabled = !S.obs.connected || !S.van.snap.connected;
    btn.title = !S.obs.connected ? "Connect OBS first" : !S.van.snap.connected ? "Waiting for the connection to the studio" : "";
    const vp = $("#vanPair");
    if (vp && !vp.dataset.touched) vp.open = !S.van.snap.connected;
  }
  if (showSettings) updateSettings();
}

// ------------------------------------------------------------ settings
function fillSettings() {
  $("#sName").value = S.name || "";
  $("#sObsAddr").value = S.obs.addr || "";
  $("#sObsAuto").checked = !S.obs.manual;
  $("#manualObs").classList.toggle("hide", !S.obs.manual);
  $("#sObsAuto").onchange = () => $("#manualObs").classList.toggle("hide", $("#sObsAuto").checked);
  $("#sLat").value = String(S.settings.latencyMs);
  if ($("#sLat").value !== String(S.settings.latencyMs)) { const o=document.createElement("option"); o.value=o.textContent=S.settings.latencyMs; $("#sLat").append(o); $("#sLat").value=String(S.settings.latencyMs); }
  $("#sStun").checked = S.settings.useStun;
  $("#ver").textContent = S.version;
  $("#acct").innerHTML = accountSettings();
  $("#sLat").disabled = S.role === "van";
  $("#setupText").textContent = S.setup.supported
    ? "Windows will ask \"Do you want to allow this app to make changes?\". Click Yes and Van Link adds its firewall rule. Restore removes it again."
    : "This computer needs no system changes for Van Link.";
}
function updateSettings() {
  const t = S.netTest, ntOut = $("#ntOut");
  $("#ntBtn").disabled = S.testing;
  $("#ntBtn").textContent = S.testing ? "Testing…" : "Run network test";
  if (t) {
    const cls = t.verdict === "limited" ? "warn" : "good";
    ntOut.innerHTML = `<div class="banner ${cls}" style="margin-top:10px;font-size:14px">${esc(t.summary)}</div>
    <div class="side" style="margin-top:8px">
    <div class="kv"><span>IPv6</span><span>${t.ipv6Internet ? "Working" : t.ipv6Address ? "Address only" : "Not available"}</span></div>
    <div class="kv"><span>Public IPv4</span><span>${esc(t.publicIpv4 || "—")}${t.sharedIpv4 ? " (shared)" : ""}</span></div>
    <div class="kv"><span>Network type</span><span>${{relaxed:"Relaxed (good for direct dialling)",strict:"Strict",unknown:"Not checked"}[t.gate]}</span></div></div>
    ${(t.advice||[]).map(a => `<p class="sub" style="margin-top:6px">• ${esc(a)}</p>`).join("")}`;
  }
  $("#panelText").textContent = S.obsPanel
    ? "The Van Link panel is in OBS. If you don't see it, open OBS and click View › Docks › Van Link."
    : "Adds this screen as a panel inside OBS. Close OBS first, then click the button.";
  $("#panelBtn").textContent = S.obsPanel ? "Add the panel again" : "Add the panel to OBS";
  $("#setupBtn").disabled = !S.setup.supported;
  $("#restoreBtn").disabled = !S.setup.supported;
}

// ------------------------------------------------------------ actions
document.addEventListener("toggle", e => { if (e.target.tagName === "DETAILS") e.target.dataset.touched = "1"; }, true);
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  const done = (k, text, err) => { notes[k] = {text, err}; viewKey = ""; refresh(); setTimeout(() => { delete notes[k]; viewKey=""; }, 8000); };
  try {
    switch (act) {
      case "role": await api("/api/role", {role: el.dataset.role}); break;
      case "signin": {
        lastEmail = $("#inEmail").value; el.disabled = true; el.textContent = "Signing in…";
        try { await api("/api/signin", {email: $("#inEmail").value, password: $("#inPass").value}); }
        finally { el.disabled = false; el.textContent = "Sign in"; }
        break;
      }
      case "redeem": el.disabled = true; await api("/api/redeem", {code: $("#regCode").value}); done("redeem", "Code accepted. Your licence is active."); break;
      case "refreshLic": el.disabled = true; await api("/api/refresh"); done("refreshLic", "Checked with the Van Link website."); break;
      case "signout": if (confirm("Sign out of Van Link on this computer? Van Link stops working here until you sign in again.")) { await api("/api/signout"); showSettings = false; } break;
      case "web": await api("/api/openweb", {name: el.dataset.page}); return;
      case "addVan": await api("/api/studio/add", {name: $("#newVanName").value}); done("add", "Van added. Send its code to the van."); break;
      case "reply": await api("/api/studio/reply", {id: el.dataset.id, code: $("#v_"+el.dataset.id+"_reply").value}); done("reply"+el.dataset.id, "Dialling the van…"); break;
      case "jump": await api("/api/studio/jump", {id: el.dataset.id}); el.textContent = "Done"; setTimeout(() => el.textContent = "Jump to live", 2000); return;
      case "removeVan": if (confirm("Remove this van and its OBS source?")) await api("/api/studio/remove", {id: el.dataset.id}); break;
      case "pair": await api("/api/van/pair", {code: $("#studioCode").value}); done("pair", "Paired. Send the reply code back to the studio."); break;
      case "unpair": if (confirm("Forget this studio? You will need a new code to reconnect.")) await api("/api/van/unpair"); break;
      case "golive": el.disabled = true; await api("/api/van/golive"); break;
      case "stop": if (confirm("Stop sending to the studio?")) await api("/api/van/stop"); break;
      case "copy": { const t = $("#"+el.dataset.src); t.select(); try { await navigator.clipboard.writeText(t.value); } catch { document.execCommand("copy"); } el.textContent = "Copied"; setTimeout(() => el.textContent = "Copy code", 2000); return; }
      case "closeSettings": showSettings = false; break;
      case "saveSettings": {
        const body = {name: $("#sName").value, obsAddr: $("#sObsAddr").value, useStun: $("#sStun").checked, obsManual: !$("#sObsAuto").checked};
        if (S.role !== "van") body.latencyMs = +$("#sLat").value;
        if ($("#sObsPass").value) body.obsPassword = $("#sObsPass").value;
        await api("/api/settings", body); $("#sMsg").className = "msg ok"; $("#sMsg").textContent = "Saved";
        if (S.role === "studio" && body.latencyMs !== S.settings.latencyMs) $("#sMsg").textContent = "Saved. New pairing codes use the new delay.";
        return;
      }
      case "quit": if (confirm("Quit Van Link? The link to the other side stops.")) { await api("/api/quit"); document.body.innerHTML = "<main><div class='card'><h2>Van Link has stopped.</h2><p class='sub'>Open it again from the Start menu or desktop.</p></div></main>"; } return;
      case "obsPanel": try { await api("/api/obspanel"); $("#panelMsg").className="msg ok"; $("#panelMsg").textContent="Done. Open OBS: the Van Link panel is under View › Docks."; } catch (e) { $("#panelMsg").className="msg err"; $("#panelMsg").textContent=e.message; } return;
      case "netTest": await api("/api/nettest"); break;
      case "setup": case "restore": { const r = await api("/api/"+act); $("#setupMsg").className = "msg " + (r.done?"ok":"err"); $("#setupMsg").textContent = r.message; return; }
      case "changeRole": if (confirm("Change role? Existing pairings on this computer will be removed.")) { await api("/api/role", {role: S.role === "studio" ? "van" : "studio"}); showSettings = false; } break;
    }
  } catch (err) {
    const k = {addVan:"add", reply:"reply"+el.dataset.id, pair:"pair", golive:"live", stop:"live", signin:"signin", redeem:"redeem", refreshLic:"refreshLic"}[act];
    if (k) done(k, err.message, true); else alert(err.message);
    return;
  }
  viewKey = ""; refresh();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "inPass" || e.target.id === "inEmail") $('[data-act="signin"]')?.click();
  if (e.target.id === "regCode") $('[data-act="redeem"]')?.click();
});
$("#gear").addEventListener("click", () => { showSettings = !showSettings; viewKey = ""; render(); window.scrollTo(0,0); });

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
